<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avon Dynamic Hiring Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --red:#E8302A; --navy:#0b1a33; --navy2:#0f2444; --ink:#0f172a; --ink2:#334155; --mut:#64748b; --line:#e2e8f0;
  --bg:#f1f5f9; --card:#fff; --green:#16a34a; --amber:#f59e0b; --blue:#2563eb; --acc:#0b5fa5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* ---------- LOGIN (The Weld) ---------- */
#login{position:fixed;inset:0;background:#05080f;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;isolation:isolate}
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.photo{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;filter:blur(3px) saturate(1.15);will-change:transform,opacity;animation:slide 27s ease-in-out infinite}
.photo.p2{animation-delay:9s}.photo.p3{animation-delay:18s}
@keyframes slide{0%{opacity:0;transform:scale(1.04) translate(0,0)}6%{opacity:1}33%{opacity:1}40%{opacity:0;transform:scale(1.16) translate(-2%,-1.5%)}100%{opacity:0;transform:scale(1.16) translate(-2%,-1.5%)}}
.wash{position:absolute;inset:0;background:linear-gradient(100deg,rgba(232,48,42,.38) 0%,rgba(6,9,16,.72) 38%,rgba(6,9,16,.72) 62%,rgba(161,192,57,.32) 100%),rgba(5,8,14,.35)}
#fxc{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.sweep{position:absolute;top:-50%;left:-60%;width:35%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:rotate(18deg);animation:sweep 10s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(3,5,10,.55))}
@media (prefers-reduced-motion:reduce){.sweep,.lcard{animation:none!important}.photo{animation:none!important}.photo.p1{opacity:1}}
.cobrand{display:flex;align-items:center;gap:22px;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid #e8edf2}
.cb-syn{height:46px;width:auto;display:block}
.cb-co{height:40px;width:auto;display:block}
.cb-x{width:1px;height:38px;background:#d9dee5}
.lcard{animation:none!important}.photo{animation:none!important}.photo.p1{opacity:1}}
.lk-syn{height:52px;width:auto;display:block}
.lk-co{height:44px;width:auto;display:block}
.lk-rule{width:1px;align-self:stretch;background:#d6dbe1}
.lcard{position:relative;z-index:1;width:100%;max-width:470px;border-radius:18px;padding:40px 46px 28px;border:2px solid transparent;
  background:linear-gradient(#f8fafc,#f8fafc) padding-box,linear-gradient(135deg,var(--red),#ff9a4a,#A1C039,var(--red)) border-box;background-size:100% 100%,300% 300%;animation:pulse 6s ease infinite;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(232,48,42,.18),0 0 90px rgba(161,192,57,.22)}
@keyframes pulse{0%,100%{background-position:0 0,0% 50%}50%{background-position:0 0,100% 50%}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#eef2ff;border:1px solid #c7d2fe;color:#1e3a8a;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(232,48,42,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(232,48,42,0)}}
.lcard h1{font-size:26px;margin:18px 0 8px;letter-spacing:-.02em}
.lcard p.sub{color:var(--mut);margin:0 0 28px;line-height:1.5}
.lcard label{display:block;font-size:14px;font-weight:500;margin:0 0 8px;color:var(--ink2)}
.lcard input{width:100%;padding:15px 18px;border-radius:10px;border:1px solid #c7d2fe;background:#e8efff;margin-bottom:20px;font-size:15px;outline:none}
.lcard input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.lbtn{width:100%;padding:16px;border:0;border-radius:10px;background:linear-gradient(180deg,#0f2444,#0b1a33);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(11,26,51,.35)}
.lbtn:disabled{opacity:.6}
.lnote{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin:16px 0 18px}
.lfoot{border-top:1px solid var(--line);padding-top:18px;text-align:center;font-size:13px;color:#94a3b8}
.lerr{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.byline{position:relative;z-index:1;margin-top:28px;color:#94a3b8;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.byline b{color:#cbd5e1}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
aside{width:288px;flex:none;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 22px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand .syn{height:46px;display:block;margin:0 0 16px 2px}
.coswitch{width:100%;background:#fff;border:0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;position:relative}
.coswitch img{max-height:34px;max-width:170px}
.coswitch .caret{position:absolute;right:10px;color:#94a3b8;font-size:12px}
.cotext{font-weight:800;color:var(--ink);font-size:15px}
.comenu{position:absolute;left:22px;right:22px;top:120px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:50;padding:6px;font-size:14px}
.comenu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left}
.comenu button:hover{background:#f1f5f9}
.comenu .sw{width:10px;height:10px;border-radius:3px}
.comenu .tag{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:var(--mut)}
.comenu .tag.live{background:#dcfce7;color:#166534}
nav{flex:1;overflow:auto;padding:10px 14px}
.navh{font-size:11px;letter-spacing:.14em;font-weight:700;color:#64748b;margin:18px 12px 8px}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#cbd5e1;padding:11px 14px;border-radius:10px;font-size:15px;font-weight:500;position:relative}
.ni:hover{background:rgba(255,255,255,.05)}
.ni.on{background:#13305a;color:#fff;font-weight:700}
.ni.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.ni svg{width:19px;height:19px;flex:none;opacity:.85}
.badge{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--amber);color:#3b1d00;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.me{padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.06)}
.meRow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.meRow b{color:#fff;display:block;font-size:14px}.meRow span{font-size:12px;color:#94a3b8}
.so{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#e2e8f0;font-weight:600}
main{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;gap:16px}
.top h2{margin:0;font-size:22px;letter-spacing:-.01em}
.top .crumb{color:var(--mut);font-size:14px;margin-top:2px}
.topR{display:flex;align-items:center;gap:20px}
.clock{text-align:right;font-size:12px;color:var(--mut)}.clock b{display:block;font-size:17px;color:var(--ink)}
.burger{display:none;border:0;background:none;font-size:22px}
.wrap{padding:28px 32px 60px;max-width:1500px}

/* hero */
.hero{background:var(--navy);border-radius:18px;color:#fff;padding:30px 32px;position:relative;overflow:hidden;border-left:5px solid var(--red)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:#93c5fd}
.hero h1{margin:6px 0 6px;font-size:30px;letter-spacing:-.02em}
.hero .hs{color:#cbd5e1;font-size:15px}
.heroBtn{position:absolute;right:32px;top:30px;z-index:2}
.bar{display:flex;height:50px;border-radius:12px;overflow:hidden;margin:28px 0 14px;background:#1e293b;position:relative;z-index:1}
.bar div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;min-width:0;transition:flex .6s}
.legend{display:flex;gap:22px;font-size:14px;color:#cbd5e1;flex-wrap:wrap;position:relative;z-index:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.legend b{color:#fff;margin-left:6px}.legend .rt{margin-left:auto}

/* cards / generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.sec{margin-top:24px}
.secH{display:flex;align-items:center;gap:14px;padding:20px 24px}
.secH h3{margin:0;font-size:17px}.secH p{margin:3px 0 0;color:var(--mut);font-size:14px}
.cnt{width:48px;height:48px;border-radius:12px;background:#0f2a52;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.g{background:var(--green)}.btn.r{background:#dc2626}.btn.s{padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.ml{margin-left:auto}
.qrow{display:flex;align-items:center;gap:14px;margin:0 24px 10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.qrow:hover{border-color:#cbd5e1}
.qrow b{display:block;font-size:15px}.qrow span{font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.tile{padding:18px 20px}.tile .k{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em}.tile .v{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.02em}.tile .tx{font-size:13px;color:var(--mut)}
.feed{padding:0 24px 18px}
.fi{display:flex;gap:12px;padding:11px 0;border-top:1px solid #f1f5f9;font-size:14px}
.fi:first-child{border-top:0}
.fi .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.fi small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.empty{padding:28px 24px;color:var(--mut);font-size:14px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#f1f5f9;color:var(--ink2);white-space:nowrap}
.pill.g{background:#dcfce7;color:#166534}.pill.r{background:#fee2e2;color:#991b1b}.pill.b{background:#dbeafe;color:#1e40af}.pill.a{background:#fef3c7;color:#92400e}.pill.p{background:#ede9fe;color:#5b21b6}
.roleRow{display:flex;align-items:center;gap:16px;padding:14px 24px;border-top:1px solid #f1f5f9}
.prog{flex:1;height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;max-width:220px}.prog i{display:block;height:100%;background:var(--green)}

/* kanban */
.kb{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 250px;background:#e8edf4;border-radius:14px;padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--acc);outline-offset:-4px}
.colH{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;font-weight:700;font-size:13px}
.colH i{width:8px;height:8px;border-radius:50%}
.colH span{margin-left:auto;background:#fff;border-radius:99px;padding:1px 8px;font-size:12px;color:var(--mut)}
.kc{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kc:active{cursor:grabbing}.kc b{font-size:14px;display:block}.kc small{color:var(--mut);font-size:12px;display:block;margin-top:2px}
.kc .ft{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:11px;color:var(--mut)}

/* table */
.tools{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tools input,.tools select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.tools input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:12px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr.cl:hover td{background:#f8fafc;cursor:pointer}
.nm{display:flex;align-items:center;gap:10px}.nm .av{width:34px;height:34px;font-size:12px;border-radius:9px}
.tblw{overflow-x:auto}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.m{max-width:70%;padding:10px 14px;border-radius:14px;background:#f1f5f9;font-size:14px;line-height:1.45;white-space:pre-wrap}
.m.mine{align-self:flex-end;background:var(--navy);color:#fff}
.m small{display:block;font-size:11px;opacity:.65;margin-bottom:3px;font-weight:600}
.cin{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.cin textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:46px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);background:#fff;height:100%;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);display:flex;flex-direction:column}
.dH{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.dH h3{margin:0 0 4px;font-size:22px}.dH p{margin:0;color:var(--mut);font-size:14px}
.x{margin-left:auto;border:0;background:#f1f5f9;width:36px;height:36px;border-radius:10px;font-size:18px;flex:none}
.dB{padding:22px 28px;flex:1}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin-bottom:22px}
.kv div small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-bottom:2px}.kv div{font-size:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.box h4{margin:0 0 10px;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl div{position:relative;font-size:13px;padding:6px 0}.tl div::before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:#cbd5e1;border:2px solid #fff}
.tl small{color:var(--mut)}
.modalW{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:26px 28px}
.modal h3{margin:0 0 4px}.modal p.s{margin:0 0 18px;color:var(--mut);font-size:14px}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f textarea{min-height:80px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mF{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{background:#b91c1c}
.cvframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px}
.coCard{display:flex;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid #f1f5f9}
.coLogo{width:120px;height:46px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;font-weight:800;font-size:13px;padding:6px;text-align:center}
.coLogo img{max-width:100%;max-height:100%}
.sw2{position:relative;width:44px;height:24px;border-radius:99px;background:#cbd5e1;border:0;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw2.on{background:var(--green)}.sw2.on::after{left:23px}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  aside{position:fixed;left:0;top:0;z-index:55;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none}
  .burger{display:block}
  .wrap{padding:18px 16px 50px}.top{padding:12px 16px}
  .heroBtn{position:static;margin-top:16px}.hero{padding:22px 20px}
  .clock{display:none}.kv,.fr{grid-template-columns:1fr}
  .lcard{padding:30px 22px 22px}.cobrand{gap:14px}.cb-syn{height:36px}.cb-co{height:31px}
  .qrow{margin:0 14px 10px}.secH{padding:16px}
}
/* ===== v2 additions ===== */
.lcard{background:#fff!important;border:1px solid rgba(255,255,255,.55)!important;animation:none!important;box-shadow:0 30px 90px rgba(0,0,0,.55)!important}
.topSearch{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#f8fafc;color:var(--mut);border-radius:10px;padding:8px 12px;font-size:13px;min-width:220px}
.topSearch kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.skel{background:linear-gradient(90deg,#e8edf3 25%,#f3f6f9 50%,#e8edf3 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:16px}
@keyframes skel{to{background-position:-200% 0}}
.view-enter{animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* drop zone */
.drop{border:2px dashed #cbd5e1;border-radius:16px;background:#f8fafc;padding:28px;text-align:center;transition:all .15s;cursor:pointer}
.drop.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,#fff);transform:scale(1.005)}
.drop b{display:block;font-size:16px;margin:8px 0 4px}.drop span{color:var(--mut);font-size:13px}
.drop .ico{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.dropmini{border:1.5px dashed #cbd5e1;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--mut);cursor:pointer;background:#fff}
.dropmini.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,#fff)}
.proc{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid #f1f5f9}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;border-top-color:var(--acc);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.draft{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 24px 12px;background:#fff}
.draft .fr{margin-top:10px}.draft textarea{min-height:70px}
.flag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:#92400e;background:#fef3c7;border-radius:8px;padding:4px 8px}
/* reports */
.rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{padding:16px 18px}.kpi .k{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.kpi .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi .tx{font-size:12.5px;color:var(--mut);margin-top:2px}
.fun{padding:6px 24px 20px}
.funr{display:grid;grid-template-columns:190px 1fr 90px;align-items:center;gap:14px;padding:7px 0}
.funr .lab{font-size:14px;font-weight:600}.funr .lab small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.track{height:22px;background:#eef2f6;border-radius:6px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#1d4ed8;min-width:2px}
.funr .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.funr .num small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.hbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 40px;gap:12px;align-items:center;padding:6px 24px;font-size:13.5px}
.hbar .track{height:10px}.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.colchart{padding:8px 24px 18px}
.colchart svg{width:100%;height:auto;max-height:220px;display:block;overflow:visible}
.colchart .gl{stroke:#e2e8f0;stroke-width:1}
.colchart .bx{fill:#1d4ed8}.colchart .bx:hover{fill:#1e40af}
.colchart text{font-size:11px;fill:#64748b;font-family:Inter,sans-serif}
.tip{position:fixed;z-index:95;background:var(--navy);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.rtbl td,.rtbl th{text-align:right;font-variant-numeric:tabular-nums}.rtbl td:first-child,.rtbl th:first-child{text-align:left}
.att{display:flex;align-items:center;gap:12px;padding:10px 24px;border-top:1px solid #f1f5f9;font-size:14px;cursor:pointer}.att:hover{background:#f8fafc}
.days{margin-left:auto;font-weight:700;font-size:13px;color:#b45309;background:#fffbeb;border-radius:999px;padding:3px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink2)}.seg button.on{background:var(--navy);color:#fff}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar2 select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600}
/* diary */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 18px 18px}
.cal .dh{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:6px 0;letter-spacing:.08em}
.cal .dd{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:#fff;font-size:12px;overflow:hidden}
.cal .dd.out{background:#f8fafc;color:#cbd5e1}.cal .dd.today{border:2px solid var(--navy)}.cal .dd .n{font-weight:700;font-size:12.5px;margin-bottom:4px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--acc);background:#f1f5f9;border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;font-weight:500;color:var(--mut)}
.diary{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
/* compare */
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.cc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cc h4{margin:0;font-size:17px}.cc .sub{color:var(--mut);font-size:13px;margin-top:2px}
.cc dl{display:grid;grid-template-columns:100px 1fr;gap:6px 10px;margin:0;font-size:13px}.cc dt{color:var(--mut);font-weight:600}.cc dd{margin:0}
.cc .sum{font-size:13px;line-height:1.5;color:var(--ink2);border-top:1px solid #f1f5f9;padding-top:10px}
.cc .note{background:#fffbeb;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#92400e}
/* drawer tabs */
.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.cvinline{width:100%;height:calc(100vh - 230px);border:1px solid var(--line);border-radius:10px}
/* command palette */
.cmdk{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;justify-content:center;padding-top:12vh}
.cmdk .box2{width:min(620px,92vw);background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;height:fit-content}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:16px;outline:none}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px}
.cmdk .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.cmdk .it.sel,.cmdk .it:hover{background:#f1f5f9}.cmdk .it small{color:var(--mut);display:block;font-size:12px}
.cmdk .grp{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.1em;padding:10px 12px 4px}
@media (max-width:1100px){.rgrid{grid-template-columns:repeat(3,1fr)}.diary{grid-template-columns:1fr}}
@media (max-width:860px){.rgrid{grid-template-columns:repeat(2,1fr)}.funr{grid-template-columns:120px 1fr 64px}.topSearch{min-width:0}.topSearch span,.topSearch kbd{display:none}.cal .dd{min-height:64px}.ev small{display:none}}
@media print{aside,.top,.noprint,.toast{display:none!important}main{margin:0}.wrap{padding:0;max-width:none}.card{break-inside:avoid;border-color:#ddd}body{background:#fff}#app{display:block}}
</style>
</head>

function startFx(){
  const cv=$('#fxc');if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=cv.getContext('2d');let W,H,pts=[];const dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(110,W*H/14000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6}))};
  size();addEventListener('resize',size);
  const col=x=>{const t=x/W;const r=Math.round(232+(161-232)*t),g=Math.round(48+(192-48)*t),b=Math.round(42+(57-42)*t);return`${r},${g},${b}`};
  let mx=-1e3,my=-1e3;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
  const loop=()=>{ctx.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<120){p.x+=dx/d*.8;p.y+=dy/d*.8}}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<140){ctx.strokeStyle=`rgba(${col((a.x+b.x)/2)},${(1-d/140)*.45})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
    for(const p of pts){ctx.fillStyle=`rgba(${col(p.x)},.95)`;ctx.shadowColor=`rgba(${col(p.x)},1)`;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
    ctx.shadowBlur=0;fxRaf=requestAnimationFrame(loop)};
  loop();
}
function stopFx(){if(fxRaf)cancelAnimationFrame(fxRaf);fxRaf=null}

/* ================= AUTH ================= */
async function boot(){
  startFx();
  try{const k=localStorage.getItem('ncal-co');if(k)S.co=k}catch(e){}
  const {data:{session}}=await sb.auth.getSession();
  if(session)await enter(session.user);
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lbtn');b.disabled=true;b.textContent='Signing in…';$('#loginErr').classList.add('hidden');
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){showLoginErr(error.message==='Invalid login credentials'?'That email and password don\'t match.':error.message);b.disabled=false;b.textContent='Sign in to portal';return}
  await enter(data.user);b.disabled=false;b.textContent='Sign in to portal';
});
function showLoginErr(m){const e=$('#loginErr');e.textContent=m;e.classList.remove('hidden')}
async function enter(user){
  const {data:me}=await sb.from('ncal_users').select('*').eq('id',user.id).maybeSingle();
  if(!me){await sb.auth.signOut();showLoginErr('This account doesn\'t have access to this portal. Contact your Syntech administrator.');return}
  S.me=me;
  sb.from('ncal_users').update({last_seen:new Date().toISOString()}).eq('id',me.id).then(()=>{});
  const {data:cos}=await sb.from('ncal_companies').select('*').order('sort_order');
  S.companies=cos||[];
  const visible=visibleCos();
  if(S.co!=='all'&&!visible.find(c=>c.id===S.co))S.co=visible[0]?.id||DEFAULT_CO;
  if(S.co==='all'&&visible.length<2)S.co=visible[0]?.id;
  $('#login').classList.add('hidden');stopFx();$('#app').classList.remove('hidden');
  $('#meAv').textContent=ini(me.full_name);$('#meName').textContent=me.full_name;$('#meTitle').textContent=me.title||(isSyn()?'Syntech':'Hiring team');
  $('#view').innerHTML='<div class="skel" style="height:240px"></div><div class="skel" style="height:300px;margin-top:24px"></div>';
  await loadAll();subscribe();tick();setInterval(tick,30000);
  const h=location.hash.slice(1);if(h)S.view=h;render();
}

/* ================= DATA ================= */
async function loadAll(){
  const [r,c,a,m,u]=await Promise.all([
    sb.from('ncal_roles').select('*').order('sort_order'),
    sb.from('ncal_candidates').select('*').order('created_at',{ascending:false}),
    sb.from('ncal_activity').select('*').order('created_at',{ascending:false}).limit(400),
    sb.from('ncal_team_messages').select('*').order('created_at').limit(500),
    sb.from('ncal_users').select('*').order('full_name')]);
  S.roles=r.data||[];S.cands=c.data||[];S.acts=a.data||[];S.chat=m.data||[];S.users=u.data||[];
  await autoAdvance();
}
/* smart auto-movement: interview date passed -> Feedback */
async function autoAdvance(){
  const now=Date.now();
  for(const c of S.cands.filter(c=>{if(c.stage!=='interview_scheduled'||!c.interview_at)return false;const t=new Date(c.interview_at);if(c.interview_tbc){t.setHours(23,59,0,0);return t.getTime()<now}return t.getTime()+3600e3<now})){
    const ok=await dbUpdate('ncal_candidates',c.id,{stage:'feedback'},{local:c});
    if(ok)logAct(c,'stage','Interview took place — moved to Feedback')}
}
function subscribe(){
  S.chans.forEach(ch=>sb.removeChannel(ch));S.chans=[];
  S.chans.push(sb.channel('ncal-c').on('postgres_changes',{event:'*',schema:'public',table:'ncal_candidates'},p=>{
    if(p.eventType==='DELETE'){S.cands=S.cands.filter(x=>x.id!==p.old.id)}
    else{const i=S.cands.findIndex(x=>x.id===p.new.id);if(i>-1)S.cands[i]=p.new;else S.cands.unshift(p.new)}
    render();
  }).subscribe());
  S.chans.push(sb.channel('ncal-m').on('postgres_changes',{event:'INSERT',schema:'public',table:'ncal_team_messages'},p=>{
    if(!S.chat.find(x=>x.id===p.new.id)){S.chat.push(p.new);if(S.view==='chat')renderChatMsgs();else{render();if(p.new.sender_id!==S.me.id)toast('💬 '+p.new.sender_name+': '+p.new.body.slice(0,60))}}
  }).subscribe());
  S.chans.push(sb.channel('ncal-a').on('postgres_changes',{event:'INSERT',schema:'public',table:'ncal_activity'},p=>{
    if(!S.acts.find(x=>x.id===p.new.id)){S.acts.unshift(p.new);if(S.view==='overview')render()}
  }).subscribe());
}
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'<b>'+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</b>'}

    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const c=S.cands.find(x=>x.id===e.dataTransfer.getData('id'));if(c&&c.stage!==col.dataset.stage)moveStage(c,col.dataset.stage)})});

async function moveStage(c,st){
  if(st==='rejected')return openReject(c);
  if(st==='interview_scheduled')return openInterview(c);
  if(st==='offer')return openOffer(c);
  if(st==='placed')return openPlaced(c);
  const ok=await dbUpdate('ncal_candidates',c.id,{stage:st},{local:c,label:'Move'});
  if(ok){logAct(c,'stage','Moved to '+STAGE[st].label);toast(c.name+' → '+STAGE[st].label)}
}

const DAY=864e5;
const fIv=c=>!c.interview_at?'Date to confirm':c.interview_tbc?new Date(c.interview_at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · time tbc':fdt(c.interview_at);

const shared=c=>c.is_spec&&!c.spec_draft;

/* ---------- lazy libraries for reading CVs ---------- */
const libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)}))}
async function cvText(file){
  try{
    if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
      for(let p=1;p<=Math.min(pdf.numPages,3);p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
        let last=null;for(const it of tc.items){if(last!==null&&Math.abs(it.transform[5]-last)>2)out+='\n';else if(last!==null)out+=' ';out+=it.str;last=it.transform[5]}out+='\n'}
      return out}
    if(/\.docx$/i.test(file.name)){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}
  }catch(e){console.warn('cv read',e)}
  return ''}
function parseCV(text,fileName){
  const lines=text.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).filter(l=>!/syntechrecruitment|01276 405 870/i.test(l));
  const tc=s=>s.toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());
  const looksName=l=>/^[A-Za-zÀ-ÿ'’\-]+( [A-Za-zÀ-ÿ'’\-]+){1,3}$/.test(l)&&l.length<40&&!/curriculum|resume|profile|cv\b/i.test(l);
  let name='',i=lines.findIndex(looksName);
  if(i>-1&&i<6)name=lines[i]===lines[i].toUpperCase()?tc(lines[i]):lines[i];
  if(!name){const g=fileName.replace(/\.(pdf|docx?)$/i,'').replace(/^[0-9a-f]{8}-/,'').replace(/[_\-.]+/g,' ').replace(/\b(cv|resume|curriculum vitae|updated|final|syntech|recruitment|\d{1,4})\b/gi,'').replace(/\s+/g,' ').trim();if(g&&g.split(' ').length<=4)name=tc(g)}
  let title='';const after=i>-1?lines.slice(i+1,i+4):lines.slice(0,3);
  for(const l of after){if(l.length<110&&!/@|\d{5,}|location|address|notice|right to work|british|citizen|visa/i.test(l)){title=l.split('|')[0].trim();break}}
  const grab=re=>{const m=text.match(re);return m?m[1].split('|')[0].replace(/\s+/g,' ').trim().slice(0,80):''};
  const location=grab(/(?:Location|Address|Based)\s*:?\s*([^\n]+)/i);
  const notice=grab(/Notice(?: period)?\s*:?\s*([^\n]+)/i);
  const salary=grab(/(?:Salary(?: expectation)?|Target salary|Current salary)\s*:?\s*([^\n]+)/i);
  const contact=/[\w.+-]+@[\w-]+\.[\w.]+/.test(text.replace(/\S*syntechrecruitment\S*/gi,''))||/(\+44\s?7\d{3}|\b07\d{3})\s?\d{3}\s?\d{3}/.test(text.replace(/01276 405 870/g,''))||/linkedin\.com\/in\//i.test(text);
  return{name,title,location,notice,salary,contact}}

/* ---------- drop zones ---------- */
function dropify(el,onFiles,{multiple=true}={}){
  if(!el)return;const inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.doc,.docx';inp.multiple=multiple;inp.className='hidden';el.appendChild(inp);
  el.addEventListener('click',e=>{if(e.target!==inp)inp.click()});inp.onchange=()=>{if(inp.files.length)onFiles([...inp.files]);inp.value=''};
  ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();e.stopPropagation();el.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();e.stopPropagation();el.classList.remove('on')}));
  el.addEventListener('drop',e=>{const fs=[...e.dataTransfer.files].filter(f=>/\.(pdf|docx?)$/i.test(f.name));if(!fs.length)return toast('Drop PDF or Word files',true);onFiles(multiple?fs:[fs[0]])})}
// stop the browser opening files dropped outside a zone
['dragover','drop'].forEach(t=>window.addEventListener(t,e=>{if(!e.target.closest?.('.drop,.dropmini'))e.preventDefault()}));

const kpi=(k,v,x)=>`<div class="card kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="tx">${x}</div></div>`;
function colChart(weeks,vals,label){
  const W=560,H=170,pad=26,max=Math.max(4,...vals),bw=(W-pad)/vals.length;const nice=Math.ceil(max/2)*2;
  const y=v=>H-(v/nice)*(H-20);
  const grid=[0,nice/2,nice].map(t=>`<line class="gl" x1="${pad}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('');
  const bars=vals.map((v,i)=>{const x=pad+i*bw+bw*.28,w=bw*.44,h=Math.max(v?3:0,H-y(v));const wl=new Date(weeks[i]).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return`<rect class="bx" x="${x}" y="${H-h}" width="${w}" height="${h}" rx="4" data-tip="${label}, week of ${wl}: ${v}"/><rect x="${pad+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tip="${label}, week of ${wl}: ${v}"/><text x="${x+w/2}" y="${H+16}" text-anchor="middle">${wl}</text>`}).join('');
  return`<div class="colchart"><svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="${label} per week">${grid}${bars}</svg></div>`}

  const byDay={};ints.forEach(c=>{const k=key(new Date(c.interview_at));(byDay[k]=byDay[k]||[]).push(c)});
  const cells=[...Array(42)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const evs=(byDay[key(d)]||[]).sort((a,b)=>new Date(a.interview_at)-new Date(b.interview_at));
    return`<div class="dd ${d.getMonth()!==m?'out':''} ${key(d)===key(today)?'today':''}"><div class="n">${d.getDate()}</div>${evs.map(c=>`<button class="ev" onclick="openCand('${c.id}')">${esc(c.name)}<small>${c.interview_tbc?'Time tbc':new Date(c.interview_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${esc((role(c.role_id)?.title||'').split('–')[0].trim())}</small></button>`).join('')}</div>`}).join('');
  const awaiting=live().filter(c=>c.stage==='interview_requested'||(c.stage==='interview_scheduled'&&!c.interview_at));
  const fb=live().filter(c=>c.stage==='feedback');
  const side=(t,p,list,btn,lab)=>`<div class="card" style="margin-bottom:16px"><div class="secH" style="padding:16px 18px"><div><h3 style="font-size:15px">${t}</h3><p style="font-size:12.5px">${p}</p></div><span class="cnt ml" style="width:30px;height:30px;font-size:13px;border-radius:8px">${list.length}</span></div>
    ${list.length?list.map(c=>`<div class="att" style="padding:9px 18px" onclick="${btn}('${c.id}')"><div style="min-width:0"><b style="font-size:13.5px">${esc(c.name)}</b><div style="font-size:12px;color:var(--mut)">${esc(role(c.role_id)?.title||'')}</div></div><span class="pill b ml">${lab}</span></div>`).join(''):'<div class="empty" style="padding:14px">All clear</div>'}<div style="height:6px"></div></div>`;
  v.innerHTML=`<div class="diary"><div class="card"><div class="secH"><div><h3>${base.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><p>All interviews at a glance · click one to open the candidate</p></div>
      <div class="ml" style="display:flex;gap:6px"><button class="btn ghost s" id="cP">‹</button><button class="btn ghost s" id="cT">Today</button><button class="btn ghost s" id="cN">›</button></div></div>
      <div class="cal">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells}</div></div>
    <div>${side('Awaiting a date','Approved for interview, not yet booked',awaiting,'iBook','Book')}${side('Feedback needed','Interview done, outcome to record',fb,'iOutcome','Record')}</div></div>`;
  $('#cP').onclick=()=>{S.cal=new Date(y,m-1,1);render()};$('#cN').onclick=()=>{S.cal=new Date(y,m+1,1);render()};$('#cT').onclick=()=>{S.cal=null;render()};
}

/* ---------- Compare shortlist ---------- */
function vCompare(v){
  const eligible=R().filter(r=>live().some(c=>c.role_id===r.id&&!['rejected','placed'].includes(c.stage)));
  if(!S.cmpRole||!eligible.find(r=>r.id===S.cmpRole))S.cmpRole=(eligible.find(r=>live().filter(c=>c.role_id===r.id&&c.stage==='feedback').length>=2)||eligible[0])?.id;
  const stagesIn=S.cmpAll?['submitted','reviewing','interview_requested','interview_scheduled','feedback','offer']:['interview_requested','interview_scheduled','feedback','offer'];
  const list=live().filter(c=>c.role_id===S.cmpRole&&stagesIn.includes(c.stage)).sort((a,b)=>STAGES.findIndex(s=>s[0]===b.stage)-STAGES.findIndex(s=>s[0]===a.stage));
  const r=role(S.cmpRole);
  v.innerHTML=`<div class="bar2 noprint"><select id="cmR">${eligible.map(x=>`<option value="${x.id}">${esc(x.title)}${S.co==='all'?' — '+esc(coName(x.company_id)):''}</option>`).join('')}</select>
    <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600"><input type="checkbox" id="cmA" ${S.cmpAll?'checked':''}> Include candidates still at review</label>
    <span style="color:var(--mut);font-size:13px" class="ml">${list.length} side by side${r?' · '+esc(r.location||''):''}</span><button class="btn s" onclick="window.print()">Print</button></div>
  ${list.length?`<div class="cmp">${list.map(c=>`<div class="cc">
     <div style="display:flex;gap:12px;align-items:center"><div class="av" style="background:${avc(c.name)}">${ini(c.name)}</div><div style="min-width:0"><h4>${esc(c.name)}</h4><div class="sub">${esc(c.current_title||'')}</div></div></div>
     <div>${stagePill(c.stage)}</div>
     ${c.interview_outcome?`<div class="note">${esc(c.interview_outcome)}</div>`:''}
     <dl><dt>Employer</dt><dd>${esc(c.current_employer||'—')}</dd><dt>Location</dt><dd>${esc(c.location||'—')}</dd><dt>Notice</dt><dd>${esc(c.notice||'—')}</dd><dt>Salary</dt><dd>${esc(c.salary_expectation||'—')}</dd><dt>Right to work</dt><dd>${esc(c.right_to_work||'—')}</dd>${c.interview_at?`<dt>Interview</dt><dd>${fIv(c)}</dd>`:''}</dl>
     ${(c.skills||[]).length?`<div style="display:flex;gap:5px;flex-wrap:wrap">${c.skills.map(s=>`<span class="pill b">${esc(s)}</span>`).join('')}</div>`:''}
     ${c.summary?`<div class="sum">${esc(c.summary)}</div>`:''}
     <div class="acts noprint" style="margin-top:auto">${c.cv_path?`<button class="btn s ghost" onclick="viewCV('${c.id}')">CV</button>`:''}<button class="btn s" onclick="openCand('${c.id}')">Open →</button></div>
   </div>`).join('')}</div>`:`<div class="card"><div class="empty">No candidates at interview stage for this role yet${S.cmpAll?'':' — tick “Include candidates still at review” to see everyone'}.</div></div>`}`;
  const s=$('#cmR');if(s){s.value=S.cmpRole||'';s.onchange=()=>{S.cmpRole=s.value;render()}}
  $('#cmA').onchange=e=>{S.cmpAll=e.target.checked;render()};
}

/* ---------- Command palette ---------- */
function openCmdk(){if($('#cmdk'))return;const w=document.createElement('div');w.className='cmdk';w.id='cmdk';
  w.innerHTML=`<div class="box2"><input id="ckq" placeholder="Search candidates, roles or pages…" autocomplete="off"><div class="res" id="ckr"></div></div>`;document.body.appendChild(w);
  w.addEventListener('mousedown',e=>{if(e.target===w)w.remove()});let sel=0,items=[];
  const pages=Object.entries(TITLES).filter(([k])=>k!=='settings'||isAdmin());
  const draw=()=>{const q=$('#ckq').value.trim().toLowerCase();
    const cs=C().filter(c=>isSyn()||!c.spec_draft).filter(c=>!q||[c.name,c.current_title,c.current_employer,role(c.role_id)?.title,c.location].join(' ').toLowerCase().includes(q)).slice(0,8);
    const rs=R().filter(r=>!q||r.title.toLowerCase().includes(q)).slice(0,4);const ps=pages.filter(([k,l])=>!q||l.toLowerCase().includes(q)).slice(0,5);
    items=[...cs.map(c=>({g:'Candidates',h:`<div class="av" style="background:${avc(c.name)};width:30px;height:30px;font-size:11px;border-radius:8px">${ini(c.name)}</div><div><b>${esc(c.name)}</b><small>${esc(role(c.role_id)?.title||(c.is_spec?'Spec CV':''))} · ${c.is_spec?'Spec CV':STAGE[c.stage]?.label}</small></div>`,run:()=>openCand(c.id)})),
      ...rs.map(r=>({g:'Roles',h:`<div class="av" style="background:#334155;width:30px;height:30px;border-radius:8px">${svg('vacancies')}</div><div><b>${esc(r.title)}</b><small>${esc(r.location||'')} · ${live().filter(c=>c.role_id===r.id&&!['rejected'].includes(c.stage)).length} active</small></div>`,run:()=>{S.f={role:r.id};go('candidates')}})),
      ...ps.map(([k,l])=>({g:'Go to',h:`<div class="av" style="background:#e2e8f0;color:#334155;width:30px;height:30px;border-radius:8px">${svg(IC[k]?k:'overview')}</div><div><b>${l}</b></div>`,run:()=>go(k)}))];
    sel=Math.min(sel,Math.max(0,items.length-1));let g='';
    $('#ckr').innerHTML=items.map((it,i)=>(it.g!==g?`<div class="grp">${(g=it.g).toUpperCase()}</div>`:'')+`<div class="it ${i===sel?'sel':''}" data-i="${i}">${it.h}</div>`).join('')||'<div class="empty">No matches</div>'};
  const inp=$('#ckq');inp.focus();inp.oninput=()=>{sel=0;draw()};draw();
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(items.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'&&items[sel]){w.remove();items[sel].run()}else if(e.key==='Escape')w.remove()};
  $('#ckr').onclick=e=>{const it=e.target.closest('[data-i]');if(it){w.remove();items[+it.dataset.i].run()}}}
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.me){e.preventDefault();openCmdk()}});

/* ---------- Drawer CV tab ---------- */
window.drawerTab=async(id,tab)=>{S.dTab=tab;openCand(id)};
async function fillInlineCV(c){const box=$('#cvInline');if(!box)return;
  if(!c.cv_path){box.innerHTML=`<div class="empty">No CV uploaded.</div>`;return}
  const {data,error}=await sb.storage.from('ncal-cvs').createSignedUrl(c.cv_path,900);if(error){box.innerHTML='<div class="empty">Could not load the CV.</div>';return}
  box.innerHTML=/\.pdf$/i.test(c.cv_path)?`<iframe class="cvinline" src="${data.signedUrl}#view=FitH"></iframe><div style="margin-top:10px"><a class="btn s ghost" href="${data.signedUrl}" target="_blank" rel="noopener">Open in new tab</a></div>`:`<div class="empty">This CV is a Word document. <a href="${data.signedUrl}" target="_blank" rel="noopener">Download it</a>.</div>`}

window.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#cmdk'))$('#cmdk').remove();else if($('#mw'))closeModal();else if($('#dr'))closeDrawer()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.view&&S.me){S.view=h;render()}});
boot();
</script>
